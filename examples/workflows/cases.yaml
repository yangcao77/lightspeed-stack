# =============================================================================
# cases.yaml — the behavioural contract for stack#51 (feature-level TDD).
#
# Each case is a request (or a config) and the status the gate must return.
# Phases 0-3 run against the real endpoint and config (the unit test and
# verify.py share contract_util.run_real_case_detail). Phase 3 is the reduced
# scope: secretless operator-catalog MCP. Cases tagged `phase: 4` run against
# reference_gate.py until that phase lands and the model is deleted; cases
# tagged `deferred` run nowhere and stay here with a `deferred_reason`.
#
#   workflow:  base definition file; `set` patches it (dotted path, list items
#              addressed by index or by their `name`); `body_set` patches the
#              request body; `generate` builds oversized inputs
#   as:        roles of the caller (default per workflow below)
#   expect:    HTTP status, or {pre269: N, post269: N} when the stages differ
#   reason:    substring that must appear in the returned reasons
#   denied_contains: substring that must appear in a caller-facing denial
#              or rejection message of the real endpoint (real-phase cases)
#   spawner:   false = stack has no spawner_configuration
#   stack_set: patches the example stack config for this case only
#   full:      (config cases) load the whole Configuration, not just the
#              workflow_engine block
#   deferred_reason: why a phase 4 / deferred case is not real yet
# phase:    stack#51 phase that makes the case real; tests/unit/cloud_agents/
#           test_workflow_contract.py runs cases up to the implemented phase.
#           `deferred` = needs work that has no scheduled phase (see README).
# Statuses: 400 unknown to the deployment / forbidden field, 403 exists but not
# for this caller, 413 too large, 422 shape or count, 202 accepted.
# =============================================================================
defaults:
  triage-github-issue:
    as: [agent-user]
    provider: {name: claude-prod, model: claude-sonnet-4-5}
  kb-answer-with-approval:
    as: [agent-support]
    provider: {name: openai-team-b, model: gpt-4o}
  admin-inline-mcp:
    as: [agent-admin]
    provider: {name: claude-prod, model: claude-sonnet-4-5}

workflow_cases:
  # ---- accepted -------------------------------------------------------------
  - {phase: 1, name: triage as agent-user, workflow: triage-github-issue, expect: 202}
  - {phase: 1, name: kb answer as agent-support, workflow: kb-answer-with-approval, expect: 202}
  - name: admin inline MCP with registry ref
    phase: 4
    deferred_reason: inline MCP with secret refs needs secret delivery and inline host grants
    workflow: admin-inline-mcp
    expect: 202
  - {phase: 3, name: triage with the granted named MCP server, workflow: triage-github-issue, expect: 202}
  - {phase: 3, name: kb answer with the granted named MCP server, workflow: kb-answer-with-approval, expect: 202}
  - name: mcp wildcard grant covers any enabled catalog server
    phase: 3
    workflow: triage-github-issue
    as: [agent-admin]
    set: {spec.mcp_servers: [kb-search]}
    expect: 202
  # Catalog servers are secretless, so spawn mode does not matter for them.
  - name: named server on spawn none is allowed (admin)
    phase: 3
    workflow: triage-github-issue
    as: [agent-admin]
    set: {spec.spawn: none}
    expect: 202
  - name: named server on spawn local is allowed (admin)
    phase: 3
    workflow: triage-github-issue
    as: [agent-admin]
    set: {spec.spawn: local}
    expect: 202
  - name: no policy, named server needs no grant (any workflow_start caller)
    phase: 3
    workflow: triage-github-issue
    stack_set: {workflow_engine.policy: null}
    set: {spec.mcp_servers: [kb-search]}
    expect: 202
  - name: no policy, inline MCP without secret_headers is allowed for an admin
    phase: 3
    workflow: admin-inline-mcp
    stack_set: {workflow_engine.policy: null}
    set: {spec.steps.query.mcp_servers.0.secret_headers: {}}
    expect: 202
  - name: credential_ref equal to the entry's credential is accepted
    phase: 1
    workflow: triage-github-issue
    body_set: {provider.credential_ref: {name: inference/anthropic-prod}}
    expect: 202
  - name: omitted provider uses workflow_engine defaults
    phase: 1
    workflow: triage-github-issue
    body_set: {provider: null}
    expect: 202
  - name: step may pick another model on the same entry
    phase: 1
    workflow: kb-answer-with-approval
    set: {spec.steps.respond.inference_provider: {name: openai-team-b, model: gpt-4o-mini}}
    expect: 202
  - name: admin may run spawn none
    phase: 0
    workflow: triage-github-issue
    as: [agent-admin]
    set: {spec.spawn: none, spec.mcp_servers: [], spec.allowed_skills: []}
    expect: 202
  - name: admin may use the admin-only azure entry with its pinned model
    phase: 1
    workflow: triage-github-issue
    as: [agent-admin]
    body_set: {provider: {name: azure-eu, model: gpt-4o}}
    set: {spec.mcp_servers: [], spec.allowed_skills: []}
    expect: 202

  # ---- caller cannot choose credentials (G1, G2) ----------------------------
  - name: run provider credentials_secret (env var name) is rejected
    phase: 0
    workflow: triage-github-issue
    body_set: {provider.credentials_secret: DATABASE_URL}
    expect: 400
    reason: credentials_secret
  - name: run provider credentials_secret is rejected even when null
    phase: 0
    workflow: triage-github-issue
    body_set: {provider.credentials_secret: null}
    expect: 400
  - name: credentials_secret is rejected for admins too
    phase: 0
    workflow: admin-inline-mcp
    body_set: {provider.credentials_secret: ANTHROPIC_API_KEY}
    expect: 400
  - name: definition.provider credentials_secret is rejected
    phase: 0
    workflow: kb-answer-with-approval
    set: {provider.credentials_secret: DATABASE_URL}
    expect: 400
  - name: credential_ref for another entry's credential is rejected
    phase: 1
    workflow: triage-github-issue
    body_set: {provider.credential_ref: {name: inference/openai-team-b}}
    expect: 400
    reason: credential_ref
  - name: credential_ref key and version are rejected until a backend supports them
    phase: 1
    workflow: triage-github-issue
    body_set: {provider.credential_ref: {name: inference/anthropic-prod, version: v1}}
    expect: 400
    reason: credential_ref
  - name: unknown keys in the provider are rejected
    phase: 1
    workflow: triage-github-issue
    body_set: {provider.base_url: https://evil.example.com}
    expect: 400

  # ---- catalog: unknown to the deployment (400) ------------------------------
  - name: unknown provider
    phase: 1
    workflow: triage-github-issue
    body_set: {provider.name: gpt-everything}
    expect: 400
    reason: unknown provider
  - name: model outside allowed_models
    phase: 1
    workflow: triage-github-issue
    body_set: {provider.model: claude-opus-4}
    expect: 400
    reason: not allowed
  - name: step provider on another catalog entry (same-entry rule)
    phase: 1
    workflow: triage-github-issue
    set: {spec.steps.triage.inference_provider: {name: openai-team-b, model: gpt-4o}}
    as: [agent-admin]
    expect: 400
    reason: same catalog entry
  - name: definition.provider on another catalog entry (same-entry rule)
    phase: 1
    workflow: triage-github-issue
    set: {provider: {name: openai-team-b, model: gpt-4o}}
    as: [agent-admin]
    expect: 400
    reason: same catalog entry
  # Unknown and disabled names get the same 400 text (the 403 for an enabled
  # server without a grant still tells them apart; see README).
  - name: unknown MCP server name
    phase: 3
    workflow: triage-github-issue
    set: {spec.mcp_servers: [github-readwrite]}
    expect: 400
    reason: unknown MCP
    denied_contains: not available to workflows
  - name: catalog entry that is not workflow_enabled gets the same 400
    phase: 3
    workflow: triage-github-issue
    stack_set: {mcp_servers.github-readonly.workflow_enabled: false}
    expect: 400
    denied_contains: not available to workflows
  - name: unknown MCP name is a 400 with no policy too
    phase: 3
    workflow: triage-github-issue
    stack_set: {workflow_engine.policy: null}
    set: {spec.mcp_servers: [github-readwrite]}
    expect: 400
    denied_contains: not available to workflows
  - name: run-level mcp_servers sent by the caller
    phase: 3
    workflow: triage-github-issue
    body_set: {mcp_servers: [github-readonly]}
    expect: 400
    denied_contains: Run-level mcp_servers
  - name: run-level mcp_servers is rejected for admins too
    phase: 3
    workflow: triage-github-issue
    as: [agent-admin]
    body_set: {mcp_servers: []}
    expect: 400
    denied_contains: Run-level mcp_servers
  - name: inline MCP with a raw secret_name/key header
    phase: 3
    workflow: admin-inline-mcp
    set:
      spec.steps.query.mcp_servers.0.secret_headers:
        Authorization: {secret_name: lightspeed-postgres, key: password}
    expect: 400
    denied_contains: cannot name a Secret
  - name: raw secret_name/key is rejected with no policy too
    phase: 3
    workflow: admin-inline-mcp
    stack_set: {workflow_engine.policy: null}
    set:
      spec.steps.query.mcp_servers.0.secret_headers:
        Authorization: {secret_name: lightspeed-postgres, key: password}
    expect: 400
    denied_contains: cannot name a Secret
  # The executor cannot deliver secrets yet, so any other non-empty
  # secret_headers shape fails the typed parse before start, in every mode.
  # admin-inline-mcp.yaml as written carries a logical ref.
  - name: inline MCP with a logical registry ref is rejected before start
    phase: 3
    workflow: admin-inline-mcp
    expect: 422
  - name: logical registry ref is rejected with no policy too
    phase: 3
    workflow: admin-inline-mcp
    stack_set: {workflow_engine.policy: null}
    expect: 422
  - name: inline MCP with a literal secret_headers value is rejected before start
    phase: 3
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.secret_headers: {Authorization: "Bearer x"}}
    expect: 422
  - name: inline MCP with an unknown registry ref
    phase: 4
    deferred_reason: registry refs are not resolved until secret delivery lands
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.secret_headers.Authorization.name: mcp/nope}
    expect: 400

  # ---- policy: exists, not for this caller (403) -----------------------------
  - name: agent-user cannot use the openai-team-b entry
    phase: 2
    workflow: triage-github-issue
    body_set: {provider: {name: openai-team-b, model: gpt-4o}}
    expect: 403
    reason: not granted
  - name: agent-support cannot use the admin-only azure entry
    phase: 2
    workflow: kb-answer-with-approval
    body_set: {provider: {name: azure-eu, model: gpt-4o}}
    set:
      provider: {name: azure-eu, model: gpt-4o}
      spec.steps.research.inference_provider: {name: azure-eu, model: gpt-4o}
    expect: 403
  - name: agent-support cannot run the triage flow (provider, MCP, skill, tool)
    phase: 2
    workflow: triage-github-issue
    as: [agent-support]
    expect: 403
  - name: named MCP server not granted to the caller
    phase: 3
    workflow: triage-github-issue
    set: {spec.mcp_servers: [kb-search]}
    expect: 403
    reason: mcp
    denied_contains: is not granted
  - name: step-level named MCP server not granted to the caller
    phase: 3
    workflow: triage-github-issue
    set: {spec.steps.report.mcp_servers: [kb-search]}
    expect: 403
    denied_contains: is not granted
  - name: named MCP with an empty mcp grant
    phase: 3
    workflow: triage-github-issue
    stack_set: {workflow_engine.policy.rules.1.mcp: []}
    expect: 403
    denied_contains: is not granted
  - name: caller without workflow_start
    phase: 2
    workflow: triage-github-issue
    as: []
    expect: 403
    reason: workflow_start
  - name: skill not granted
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.allowed_skills: [kb-search]}
    expect: 403
    reason: skill
  # Ephemeral steps need an explicit tools: ["*"] grant (the sandbox does not
  # enforce finite tool lists). agent-restricted has the triage grants with
  # tools: [github.read]; the wildcard roles pass whatever allowed_tools says.
  - name: finite tools grant is rejected for ephemeral steps
    phase: 2
    workflow: triage-github-issue
    as: [agent-restricted]
    expect: 403
    reason: tools_not_enforceable
    denied_contains: wildcard
  - name: finite tools grant is rejected even when the requested tool is granted
    phase: 2
    workflow: triage-github-issue
    as: [agent-restricted]
    set: {spec.steps.triage.tools: [github.read], spec.steps.triage.permissions.allowed_tools: [github.read]}
    expect: 403
    reason: tools_not_enforceable
    denied_contains: wildcard
  - name: wildcard tools grant passes with a finite allowed_tools request
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.permissions.allowed_tools: [github.read]}
    expect: 202
  - name: wildcard tools grant passes with allowed_tools null
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.permissions.allowed_tools: null}
    expect: 202
  - name: service account not granted
    phase: 2
    workflow: triage-github-issue
    set: {spec.service_account: kb-runner}
    expect: 403
    reason: service account
  - name: namespace not granted
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.target_namespaces: [kube-system]}
    expect: 403
    reason: namespace
  - name: step timeout over the role limit
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.timeout_seconds: 3600}
    expect: 403
    reason: timeout
  - name: step max_tokens over the role limit
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.permissions.max_tokens: 900000}
    expect: 403
    reason: max_tokens
  - name: step max_retries over the role limit
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.triage.max_retries: 9}
    expect: 403
    reason: max_retries
  # Plan rev 5c/5d: the executor has no workflow deadline and spec.timeout_seconds
  # is only an inherited per-step default (both triage steps set their own), so
  # the workflow budget is the sum of step_timeout x (max_retries + 1). Here
  # 600 x 3 + 900 x 3 = 4500 against a 3600 limit; each step is within its own.
  - name: workflow total over the role limit (sum of step budgets)
    phase: 2
    workflow: triage-github-issue
    set: {spec.steps.report.timeout_seconds: 900, spec.steps.report.max_retries: 2}
    expect: 403
    reason: workflow

  # ---- spawn modes, images, advisory -----------------------------------------
  - name: spawn none as agent-user
    phase: 0
    workflow: triage-github-issue
    set: {spec.spawn: none, spec.mcp_servers: [], spec.allowed_skills: []}
    expect: 403
    reason: spawn
  - name: spawn local on one step as agent-user
    phase: 0
    workflow: triage-github-issue
    set: {spec.steps.report.spawn: local}
    expect: 403
  - name: ephemeral steps without spawner_configuration
    phase: 0
    workflow: triage-github-issue
    spawner: false
    expect: 403
    reason: spawner_configuration
  - name: custom image on the request
    phase: 0
    workflow: triage-github-issue
    body_set: {sandbox_image: evil.example.com/sandbox:latest}
    expect: 403
    reason: image
  - name: custom image on a step spawn_config
    phase: 0
    workflow: triage-github-issue
    set: {spec.steps.triage.spawn_config.sandbox_image: evil.example.com/sandbox:latest}
    expect: 403
  - name: custom skills image
    phase: 0
    workflow: triage-github-issue
    set: {skills: {image: evil.example.com/skills:latest}}
    expect: 403
  - name: advisory mode as agent-user
    phase: 0
    workflow: triage-github-issue
    set: {advisory: true}
    expect: 403
    reason: advisory
  - name: advisory mode as admin
    phase: 0
    workflow: triage-github-issue
    as: [agent-admin]
    set: {advisory: true}
    expect: 202
  - name: secret_headers MCP on spawn none (needs cloud-agents#269)
    phase: deferred
    deferred_reason: secret delivery and the cloud-agents#269 stage split are not part of the secretless Phase 3
    workflow: triage-github-issue
    as: [agent-admin]
    set: {spec.spawn: none}
    expect: {pre269: 403, post269: 202}

  # ---- inline MCP -------------------------------------------------------------
  # Inline MCP stays as in Phase 2: admin-only without a policy, 403 for every
  # caller in policy mode. The definition's secret_headers are emptied so the
  # request reaches the policy check (otherwise it is a 422 first).
  - name: inline MCP as agent-user
    phase: 3
    workflow: admin-inline-mcp
    as: [agent-user]
    set: {spec.steps.query.mcp_servers.0.secret_headers: {}}
    expect: 403
    reason: inline MCP
    denied_contains: inline MCP
  - name: inline MCP is denied to admins in policy mode
    phase: 3
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.secret_headers: {}}
    expect: 403
    denied_contains: inline MCP
  - name: inline MCP with no policy is admin-only
    phase: 3
    workflow: admin-inline-mcp
    as: [agent-user]
    stack_set: {workflow_engine.policy: null}
    set: {spec.steps.query.mcp_servers.0.secret_headers: {}}
    expect: 403
    denied_contains: inline MCP
  # The cases below need inline host grants (and SSRF confinement), which stay
  # reserved in the policy schema until redirects and resolved addresses can be
  # confined. They run against reference_gate.py.
  - name: inline MCP host not on the allow-list
    phase: 4
    deferred_reason: inline host grants are reserved (no SSRF confinement yet)
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.url: "https://evil.example.com/mcp"}
    expect: 403
    reason: host
  - name: inline MCP over plain http
    phase: 4
    deferred_reason: inline host grants are reserved (no SSRF confinement yet)
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.url: "http://mcp.internal.example.com/incidents"}
    expect: 403
    reason: https
  - name: inline MCP with credentials in the URL
    phase: 4
    deferred_reason: inline host grants are reserved (no SSRF confinement yet)
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.url: "https://user:pw@mcp.internal.example.com/incidents"}
    expect: 403
    reason: userinfo
  - name: inline MCP with a literal header value
    phase: 4
    deferred_reason: inline host grants are reserved (no SSRF confinement yet)
    workflow: admin-inline-mcp
    set: {spec.steps.query.mcp_servers.0.headers: {Authorization: "Bearer ghp_x"}}
    expect: 403
    reason: literal header

  # ---- limits (G9) -------------------------------------------------------------
  - name: definition over the byte cap
    phase: 0
    workflow: triage-github-issue
    generate: {pad_bytes: 300000}
    expect: 413
  - name: too many steps
    phase: 0
    workflow: triage-github-issue
    generate: {steps: 65}
    expect: 422
  - name: too many MCP servers on the workflow default
    phase: 0
    workflow: triage-github-issue
    generate: {mcp_servers: 17}
    expect: 422
  - name: too many secret_headers on an inline server
    phase: 3
    workflow: admin-inline-mcp
    generate: {secret_headers: 33}
    expect: 422
  - name: missing spec.steps
    phase: 0
    workflow: triage-github-issue
    set: {spec.steps: []}
    expect: 422
  - name: legacy step "provider" alias is a shape error
    phase: 0
    workflow: triage-github-issue
    set: {spec.steps.triage.provider: {name: claude-prod}}
    expect: 422

# Config-load failures. `set` patches the parsed lightspeed-stack.yaml.
config_cases:
  - name: allowed_models [] is rejected
    phase: 1
    set: {workflow_engine.providers.claude-prod.allowed_models: []}
    error: allowed_models
  - name: executor_type outside APPROVED_INFERENCE_PROVIDERS
    phase: 1
    set: {workflow_engine.providers.claude-prod.executor_type: ollama}
    error: executor_type
  - name: credential without a secrets binding
    phase: 1
    set: {workflow_engine.providers.claude-prod.credential.name: inference/missing}
    error: no secrets binding
  - name: pre-269 inference credential must be env-backed
    phase: 1
    set: {workflow_engine.secrets.inference/anthropic-prod: {name: inference/anthropic-prod, backend: k8s, secret_name: s, key: k}}
    stage: pre269
    error: must be env
  - name: default_provider must be in the catalog
    phase: 1
    set: {workflow_engine.default_provider: gone}
    error: default_provider
  - name: default_model must pass the default provider's allowed_models
    phase: 1
    set: {workflow_engine.default_model: claude-opus-4}
    error: default_model
  # `full: true` cases load the whole Configuration (MCP catalog cross-checks).
  - name: workflow_enabled MCP with request-bound auth
    phase: 3
    full: true
    set: {mcp_servers.github-readonly.authorization_headers: {Authorization: client}}
    error: authorization_headers must be empty
  - name: workflow_enabled MCP with propagated headers
    phase: 3
    full: true
    set: {mcp_servers.kb-search.headers: [x-rh-identity]}
    error: propagated
  - name: workflow_enabled MCP with credentials in the URL
    phase: 3
    full: true
    set: {mcp_servers.kb-search.url: "https://user:pw@mcp.internal.example.com/kb"}
    error: userinfo
  - name: workflow_enabled MCP with a name that is not a safe path segment
    phase: 3
    full: true
    set: {mcp_servers.kb-search.name: KB_Search}
    error: name must match
  - name: catalog entry with secret_headers is rejected (no such field yet)
    phase: 3
    full: true
    set: {mcp_servers.kb-search.secret_headers: {X-API-Key: {name: mcp/kb-search}}}
    error: secret_headers
  - name: policy mcp grant naming a server that is not workflow_enabled
    phase: 3
    full: true
    set: {workflow_engine.policy.rules.1.mcp: [no-such-server]}
    error: not a workflow_enabled
  - name: policy inline_mcp grant is still reserved
    phase: 3
    set: {workflow_engine.policy.rules.1.inline_mcp: true}
    error: not supported yet
  - name: policy mcp_secrets grant is still reserved
    phase: 3
    set: {workflow_engine.policy.rules.1.mcp_secrets: [mcp/incidents]}
    error: not supported yet
  - name: MCP secret ref without a binding
    phase: deferred
    deferred_reason: MCP secret refs need the secret delivery design (see README)
    set: {mcp_servers.kb-search.secret_headers.X-API-Key.name: mcp/missing}
    error: no secrets binding
  - name: policy rule naming an undefined provider
    phase: 2
    set: {workflow_engine.policy.rules.0.providers: [ghost]}
    error: unknown provider
