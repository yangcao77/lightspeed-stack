# =============================================================================
# lightspeed-stack.yaml — operator configuration for K8s (namespace: lightspeed)
#
# Covers the catalog items needed by the two example workflows in this
# directory:
#   - triage-github-issue.yaml     (roles: agent-user)
#   - kb-answer-with-approval.yaml (roles: agent-support)
#
# Blocks marked PLAN(stack#51) follow the plan in
# https://github.com/jameswnl/lightspeed-stack/issues/51#issuecomment-5911977694
# Everything in this file loads on the current schema.
# Secret VALUES live only in k8s-secrets.yaml / the Deployment env — this file
# holds backend bindings (env var names, K8s Secret names), never values.
# =============================================================================
name: Lightspeed Core Stack (workflows on K8s)

service:
  host: 0.0.0.0
  port: 8080
  auth_enabled: true
  workers: 2
  color_log: false
  access_log: true

llama_stack:
  use_as_library_client: false
  url: http://llama-stack.lightspeed.svc:8321

user_data_collection:
  feedback_enabled: true
  feedback_storage: /data/feedback
  transcripts_enabled: true
  transcripts_storage: /data/transcripts

# Llama Stack-side defaults. Once PLAN(stack#51) lands, these apply to
# Llama Stack-backed endpoints (/query, /responses) only; workflow runs
# use workflow_engine.default_* instead.
inference:
  default_provider: openai
  default_model: gpt-4o-mini

database:
  postgres:
    host: postgres.lightspeed.svc
    port: 5432
    db: lightspeed
    user: lightspeed
    password: "${env.POSTGRES_PASSWORD}"
    namespace: public
    ssl_mode: verify-full
    ca_cert_path: /etc/postgres-tls/ca.crt   # from Secret lightspeed-postgres-tls

# Role-based policy needs real roles. The k8s, noop and api-key modules use
# no-op resolvers (no roles beyond "*", access_rules ignored, every caller
# counts as admin), so this example uses jwk-token with role_rules.
authentication:
  module: jwk-token
  skip_for_health_probes: true
  skip_for_metrics: true
  jwk_config:
    url: https://keycloak.example.com/realms/lightspeed/protocol/openid-connect/certs
    jwt_configuration:
      user_id_claim: sub
      username_claim: preferred_username
      role_rules:
        - jsonpath: "$.realm_access.roles[*]"
          operator: contains
          value: lightspeed-agent-user
          roles: [agent-user]
        - jsonpath: "$.realm_access.roles[*]"
          operator: contains
          value: lightspeed-agent-support
          roles: [agent-support]
        - jsonpath: "$.realm_access.roles[*]"
          operator: contains
          value: lightspeed-agent-admin
          roles: [agent-admin]
        - jsonpath: "$.realm_access.roles[*]"
          operator: contains
          value: lightspeed-agent-restricted
          roles: [agent-restricted]

# Coarse RBAC: "may submit / view / approve / cancel at all".
# An access rule with the `admin` action cannot list other actions (config
# load fails); `admin` implies every other action.
# Fine-grained "may use THIS provider/MCP/skill/spawn/image" lives in
# workflow_engine.policy (PLAN(stack#51)) below.
authorization:
  access_rules:
    - role: agent-user
      actions: [workflow_start, workflow_view, workflow_cancel]
    - role: agent-support
      actions: [workflow_start, workflow_view, workflow_approve, workflow_cancel]
    - role: agent-restricted
      actions: [workflow_start, workflow_view]
    - role: agent-admin
      actions: [admin]

# ---------------------------------------------------------------------------
# MCP catalog. The stack owns URL and transport here; callers only send the
# catalog `name`. workflow_enabled entries must be secretless for now: no
# secret_headers, headers or authorization_headers, and no credentials in the
# URL or query string. Every tool on a granted server is available to the step
# (see README.md). URLs are operator-trusted, not SSRF-confined.
# ---------------------------------------------------------------------------
mcp_servers:
  - name: github-readonly
    provider_id: model-context-protocol
    url: https://mcp.internal.example.com/github
    workflow_enabled: true            # opt in to workflow use
  - name: kb-search
    provider_id: model-context-protocol
    url: https://mcp.internal.example.com/kb
    workflow_enabled: true

# ---------------------------------------------------------------------------
# Workflow engine + PLAN(stack#51) catalogs and policy.
# ---------------------------------------------------------------------------
workflow_engine:
  enabled: true
  max_concurrent_workflows: 10
  transcript_retention_days: 30

  # PLAN(stack#51): provider catalog. Non-empty = governed mode, unknown names deny.
  providers:
    - name: claude-prod              # logical name callers send
      executor_type: anthropic       # must be in APPROVED_INFERENCE_PROVIDERS
      credential: {name: inference/anthropic-prod}   # exactly one per entry
      allowed_models: [claude-sonnet-4-5, claude-haiku-4-5]  # null = any; [] = load failure
    - name: openai-team-b
      executor_type: openai
      credential: {name: inference/openai-team-b}
      # allowed_models omitted (null) = any model
    - name: azure-eu                 # admin-only
      executor_type: azure
      credential: {name: inference/azure-eu}
      allowed_models: [gpt-4o]
      # base_url is rejected until the executor accepts an endpoint
      # (cloud-agents#269); the Azure endpoint comes from the sandbox env.

  # PLAN(stack#51): defaults for cloud-agents workflow runs.
  default_provider: claude-prod
  default_model: claude-sonnet-4-5

  # PLAN(stack#51): logical ref -> backend binding. Operator-only. Inference
  # credentials only; catalog MCP servers are secretless.
  secrets:
    - name: inference/anthropic-prod
      backend: env                   # must be env pre-cloud-agents#269
      env: ANTHROPIC_API_KEY         # injected from Secret lightspeed-inference-creds
    - name: inference/openai-team-b
      backend: env
      env: OPENAI_TEAM_B_KEY
    - name: inference/azure-eu
      backend: env
      env: AZURE_OPENAI_API_KEY

  # Per-role grants (workflow_engine.policy). A caller gets the union of the
  # rules for its roles and everything they inherit; no rule means no access.
  # Limits are capped by the stack (step timeout 3600s, workflow 86400s,
  # retries 5, tokens 1,000,000). Agent steps must declare
  # permissions.max_tokens, because an omitted value counts as unlimited.
  # `mcp` grants catalog servers by name ("*" = every workflow_enabled entry;
  # missing or [] = none). Inline MCP is not granted to anyone here: it is
  # admin-only without a policy and denied for every caller with one.
  # Timeouts, max_tokens and the workflow total are declared budgets checked
  # at submission, not runtime limits (see README.md).
  # Ephemeral steps need an explicit tools: ["*"] grant. The sandbox does not
  # enforce finite tool lists, so a finite grant is rejected with
  # tools_not_enforceable (agent-restricted below shows it). The wildcard
  # authorizes the sandbox's default tool access; it does not promise that a
  # step's permissions.allowed_tools is enforced (see README.md).
  policy:
    rules:
      # "*" applies to every caller.
      - role: "*"
        spawn_modes: [ephemeral]
      # Triage flow (triage-github-issue.yaml)
      - role: agent-user
        providers: [claude-prod]
        skills: [triage]
        mcp: [github-readonly]
        tools: ["*"]
        service_accounts: [workflow-runner]
        namespaces: [sandbox-workloads]
        limits:
          max_step_timeout_seconds: 900
          max_workflow_seconds: 3600
          max_retries: 2
          max_tokens: 200000
      # KB answer flow (kb-answer-with-approval.yaml)
      - role: agent-support
        providers: [openai-team-b]
        skills: [kb-search]
        mcp: [kb-search]
        tools: ["*"]
        service_accounts: [kb-runner]
        namespaces: [sandbox-workloads]
        limits:
          max_step_timeout_seconds: 1200
          max_workflow_seconds: 3600
          max_retries: 1
          max_tokens: 200000
      # Same triage grants as agent-user but a finite tools list: ephemeral
      # submissions are rejected (403 tools_not_enforceable) until the sandbox
      # can enforce tool lists. Kept as the worked rejection example.
      - role: agent-restricted
        providers: [claude-prod]
        skills: [triage]
        mcp: [github-readonly]
        tools: [github.read]
        service_accounts: [workflow-runner]
        namespaces: [sandbox-workloads]
        limits:
          max_step_timeout_seconds: 900
          max_workflow_seconds: 3600
          max_retries: 2
          max_tokens: 200000
      # Admins get both flows plus the admin-only provider, advisory mode and
      # the spawn modes that run outside a sandbox (which also need admin).
      - role: agent-admin
        inherit: [agent-user, agent-support]
        providers: [azure-eu]
        mcp: ["*"]
        spawn_modes: [local, none]
        advisory: true

# ---------------------------------------------------------------------------
# Ephemeral spawner: OpenShell gateway. Sandboxes get credentials via OpenShell
# provider injection (placeholder in sandbox env, value in supervisor proxy).
# The sandbox image also carries /skills/triage and /skills/kb-search
# (see README.md). Requires PLAN(stack#51) policy + secrets above for full
# governance; spawner fields themselves are current schema.
# ---------------------------------------------------------------------------
spawner:
  type: openshell
  openshell_gateway_url: "openshell-gateway.lightspeed.svc:443"
  openshell_workspace: lcore-prod
  sandbox_image: quay.io/example/lightspeed-agentic-sandbox@sha256:a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4a1b2c3d4
  openshell_tls_ca: /etc/openshell-tls/ca.crt
  openshell_tls_cert: /etc/openshell-tls/tls.crt
  openshell_tls_key: /etc/openshell-tls/tls.key
  max_pods: 50
