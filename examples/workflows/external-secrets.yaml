# =============================================================================
# external-secrets.yaml — production source of the Secrets in k8s-secrets.yaml.
#
# Values live in the enterprise secret manager (Vault here) and are synced into
# K8s Secrets by External Secrets Operator, so no value is committed to git or
# applied by hand. The stack consumes the resulting K8s Secrets exactly as in
# k8s-secrets.yaml (env injection pre-#269, API reads post-#269), so it needs
# no manager-specific code until a native backend lands.
# k8s-secrets.yaml remains the bootstrap/dev path.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: lightspeed-inference-creds, namespace: lightspeed}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lightspeed}
  target: {name: lightspeed-inference-creds, creationPolicy: Owner}
  data:
    - {secretKey: ANTHROPIC_API_KEY, remoteRef: {key: lightspeed/inference/anthropic-prod, property: api_key}}
    - {secretKey: OPENAI_TEAM_B_KEY, remoteRef: {key: lightspeed/inference/openai-team-b, property: api_key}}
    - {secretKey: AZURE_OPENAI_API_KEY, remoteRef: {key: lightspeed/inference/azure-eu, property: api_key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: lightspeed-postgres, namespace: lightspeed}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lightspeed}
  target: {name: lightspeed-postgres, creationPolicy: Owner}
  data:
    - {secretKey: password, remoteRef: {key: lightspeed/postgres, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: lightspeed-postgres-tls, namespace: lightspeed}
spec:
  refreshInterval: 24h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lightspeed}
  target: {name: lightspeed-postgres-tls, creationPolicy: Owner}
  data:
    - {secretKey: ca.crt, remoteRef: {key: lightspeed/postgres-tls, property: ca}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: openshell-gateway-tls, namespace: lightspeed}
spec:
  refreshInterval: 24h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-lightspeed}
  target: {name: openshell-gateway-tls, creationPolicy: Owner, template: {type: kubernetes.io/tls}}
  data:
    - {secretKey: ca.crt, remoteRef: {key: lightspeed/openshell-gateway-tls, property: ca}}
    - {secretKey: tls.crt, remoteRef: {key: lightspeed/openshell-gateway-tls, property: cert}}
    - {secretKey: tls.key, remoteRef: {key: lightspeed/openshell-gateway-tls, property: key}}
