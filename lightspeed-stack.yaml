name: Lightspeed Core Stack (LCS)
service:
  host: 0.0.0.0
  port: 8080
  base_url: http://localhost:8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
# ogx configuration
# When using 'make run', a container is ALWAYS launched at http://localhost:8321 (hardcoded in Makefile).
# This ogx section controls where lightspeed-core connects to OGX.
# To use a different port: override with 'make run OGX_PORT=<port>' and update the url below,
# or run OGX manually and don't use 'make run'.
ogx:
  use_as_library_client: false
  url: http://localhost:8321
  # api_key: custom-key  # Uncomment if your OGX requires authentication

compaction:
  enabled: true

inference:
  providers:
    - type: vllm
      id: meta-llama
      allowed_models:
        - name: meta-llama-31-8b-quantizedw4a16
          provider_model_id: meta-llama-31-8b-quantizedw4a16
          metadata:
            # Served max_model_len from the vLLM /v1/models endpoint.
            context_window: 113000
      config:
        base_url: ${env.VLLM_BASE_URL}
        api_key: ${env.VLLM_API_KEY}
    - type: openai
      id: openai
      allowed_models:
        # https://developers.openai.com/api/docs/models/gpt-5.4-mini
        - name: gpt-5.4-mini
          provider_model_id: gpt-5.4-mini
          metadata:
            context_window: 400000
        # https://developers.openai.com/api/docs/models/gpt-5.5
        - name: gpt-5.5
          provider_model_id: gpt-5.5
          metadata:
            context_window: 1050000
        # https://developers.openai.com/api/docs/models/gpt-6.1-sol
        - name: gpt-6.1-sol
          provider_model_id: gpt-6.1-sol
          metadata:
            context_window: 1050000
        # https://developers.openai.com/api/docs/models/gpt-6-luna
        - name: gpt-6-luna
          provider_model_id: gpt-6-luna
          metadata:
            context_window: 1050000
      config:
        api_key: ${env.OPENAI_API_KEY}
    - type: vertexai
      id: vertexai
      allowed_models:
        # https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-5-flash-lite
        - name: gemini-3.5-flash-lite
          provider_model_id: publishers/google/models/gemini-3.5-flash-lite
          metadata:
            context_window: 1048576
        # https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-8-flash
        - name: gemini-3.8-flash
          provider_model_id: publishers/google/models/gemini-3.8-flash
          metadata:
            context_window: 1048576
        # https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-1-pro
        - name: gemini-3.1-pro-preview
          provider_model_id: publishers/google/models/gemini-3.1-pro-preview
          metadata:
            context_window: 1048576
      config:
        project: ${env.VERTEX_AI_PROJECT}
        location: ${env.VERTEX_AI_LOCATION:=global}
  # This checkout's OGX-backed compaction engine still reads this map.
  # Remove it after the Pydantic AI compaction migration uses model metadata.
  context_windows:
    meta-llama/meta-llama-31-8b-quantizedw4a16: 113000
    openai/gpt-5.4-mini: 400000
    openai/gpt-5.5: 1050000
    openai/gpt-6.1-sol: 1050000
    openai/gpt-6-luna: 1050000
    vertexai/publishers/google/models/gemini-3.5-flash-lite: 1048576
    vertexai/publishers/google/models/gemini-3.8-flash: 1048576
    vertexai/publishers/google/models/gemini-3.1-pro-preview: 1048576

user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"

# Conversation cache for storing Q&A history
conversation_cache:
  type: "sqlite"
  sqlite:
    db_path: "/tmp/data/conversation-cache.db"  # Persistent across requests, can be deleted between test runs

authentication:
  module: "noop"

